# Alcance del análisis de SonarQube Cloud (KNOCK-297). La organización y la clave del proyecto llegan por las variables
# del repositorio desde .github/workflows/sonarcloud.yml; el token nunca va en este archivo.
sonar.sourceEncoding=UTF-8

# Código principal y pruebas: los dos conjuntos no pueden solaparse.
sonar.sources=app/lib,panel/src,landing
sonar.tests=app/test,app/integration_test,app/test_driver,panel/src,landing/tests
sonar.test.inclusions=app/test/**,app/integration_test/**,app/test_driver/**,panel/src/**/*.spec.ts,landing/tests/**

# Fuera del análisis: pruebas (en el conjunto principal), código generado, compilados, dependencias y documentación.
sonar.exclusions=panel/src/**/*.spec.ts,landing/tests/**,app/lib/l10n/generado/**,app/packages/knock_api/**,panel/src/app/api/**,**/*.g.dart,**/*.freezed.dart,**/build/**,**/dist/**,**/node_modules/**,**/docs/**,**/*.md

# La landing es estática y no mide cobertura.
sonar.coverage.exclusions=landing/**

sonar.dart.lcov.reportPaths=app/coverage/lcov.info
sonar.javascript.lcov.reportPaths=panel/coverage/panel/lcov.info
sonar.typescript.tsconfigPaths=panel/tsconfig.app.json,panel/tsconfig.spec.json
sonar.python.version=3.12
