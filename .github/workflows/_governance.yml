name: _governance

# Verificaciones de gobierno SDD reutilizables (las llaman ci-pr.yml y nightly.yml).
# Son baratas y no ejecutan código del proyecto: solo scripts de scripts/ con Python estándar.

on:
  workflow_call:
    inputs:
      spec:
        description: "ID de la spec del issue (HU-NNN, TT-ÁREA-NN, BUG-NNN) para la trazabilidad"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  governance:
    name: Gobierno SDD y arquitectura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Adaptadores de agentes sincronizados con su fuente
        run: python scripts/sync_agents.py --check
      - name: Specs válidas (secciones, casos TC, estados, clave de Jira)
        run: python scripts/sdd_lint.py
      - name: Trazabilidad caso ↔ prueba de la spec del issue
        if: inputs.spec != ''
        env:
          SPEC: ${{ inputs.spec }}
        run: python scripts/sdd_lint.py --trace "$SPEC"
      - name: Registro de excepciones (vigencia y supresiones sin EXC-NNN)
        run: python scripts/ci/check_exceptions.py
      - name: Acciones de GitHub fijadas a SHA
        run: python scripts/ci/pin_actions.py --check
      - name: Pruebas de los scripts de CI (detección de cambios, gate, versión y publicación; spec 007 y 011)
        run: |
          python scripts/ci/test_detect_changes.py
          python scripts/ci/test_publish_info.py
          python scripts/ci/test_publish_workflow.py
          python scripts/ci/test_version.py
      - name: Pruebas del script de pre-revisión con IA (servidores falsos, sin red ni llaves)
        if: hashFiles('scripts/ci/test_ai_review.py') != ''
        run: python scripts/ci/test_ai_review.py
      - name: Arquitectura y código duplicado (mapa de código)
        run: python scripts/codemap.py --check
      - name: Mapa de código actualizado en el commit
        run: git diff --quiet -- docs/architecture/CODEMAP.md || { echo "::error::docs/architecture/CODEMAP.md no está al día. Corre python scripts/codemap.py y súbelo."; exit 1; }
      # jscpd y sus dependencias quedan fijados en .github/tools/jscpd (lockfile con sumas) y se instalan sin scripts,
      # fuera del repositorio para que no entren en el análisis.
      - name: Duplicación textual (jscpd)
        run: |
          mkdir -p "$RUNNER_TEMP/jscpd"
          cp .github/tools/jscpd/package.json .github/tools/jscpd/package-lock.json "$RUNNER_TEMP/jscpd/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/jscpd"
          "$RUNNER_TEMP/jscpd/node_modules/.bin/jscpd" --config .jscpd.json .
      - name: Lint de workflows (actionlint, CLI fijada por versión y suma de verificación)
        run: |
          curl -sSfL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: arquitectura
          path: |
            docs/architecture/
            reports/jscpd/
          if-no-files-found: ignore
