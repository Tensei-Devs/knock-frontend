name: sonarcloud

# Análisis de SonarQube Cloud (informativo, KNOCK-297). Es un workflow APARTE y queda FUERA del gate: ni `ci-pr` ni la
# protección de ramas dependen de él, y si falla no bloquea ningún PR.
# Reemplaza al «Automatic Analysis» (apagado): ese modo no analiza Dart ni importa cobertura.
# Reutiliza la cobertura que ya genera `ci-pr`: artefactos `app-coverage` y `panel-reports` de esa corrida. Aquí no se
# ejecutan pruebas; solo se resuelven dependencias (el analizador de Dart y el de TypeScript las usan para los tipos).
# El alcance del análisis está en `sonar-project.properties`.
# Alcance: solo la rama principal `main` (aquí no se analizan PR).
# Un `workflow_run` solo se ejecuta si este archivo ya está en la rama predeterminada (`main`): no habrá análisis hasta
# que llegue a `main` con la promoción. Sin `workflow_dispatch`: Checkov (CKV_GHA_7) exige que no tenga entradas.
# Seguridad: solo corre para corridas de `ci-pr` disparadas por un push a `main` de este repositorio (código ya revisado y
# fusionado), nunca para PR: el token no se expone a código de un PR. El token solo llega a la comprobación de la
# configuración y al escáner. Sin caché, permisos mínimos y acciones fijadas a SHA.
# Configuración en GitHub (no se crea aquí): secreto SONAR_TOKEN y variables SONAR_ORGANIZATION y SONAR_PROJECT_KEY.

on:
  workflow_run:
    workflows: [ci-pr]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: sonarcloud-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  CI_RUN_ID: ${{ github.event.workflow_run.id }}
  CI_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  sonarcloud:
    name: SonarCloud (informativo, fuera del gate)
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Comprobar la configuración
        id: cfg
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::warning::Falta SONAR_TOKEN, SONAR_ORGANIZATION o SONAR_PROJECT_KEY: se omite el análisis."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: ${{ env.CI_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.cfg.outputs.ready == 'true'
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: false
      - name: Dependencias de la app (las necesita el analizador de Dart)
        if: steps.cfg.outputs.ready == 'true'
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Dependencias del panel (tipos de TypeScript)
        if: steps.cfg.outputs.ready == 'true'
        working-directory: panel
        run: npm ci --ignore-scripts
      - name: Cobertura de la app (corrida de ci-pr)
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: app-coverage
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}
          path: app/coverage
      - name: Cobertura del panel (corrida de ci-pr)
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: panel-reports
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}
          path: panel
      - name: Rutas de la cobertura relativas a la raíz del repositorio
        if: steps.cfg.outputs.ready == 'true'
        run: |
          fix() {
            test -f "$1" || { echo "::error::La corrida $CI_RUN_ID no trae $1"; exit 1; }
            # `SF:` puede venir absoluta o relativa al proyecto; se deja como <proyecto>/<ruta>.
            sed -i -E -e "s#^SF:$GITHUB_WORKSPACE/#SF:#" -e "\#^SF:$2/#! s#^SF:#SF:$2/#" "$1"
            first=$(grep -m1 '^SF:' "$1" | cut -c4- | tr -d '\r')
            test -f "$first" || { echo "::error::$1 apunta a un archivo que no existe: $first"; exit 1; }
          }
          fix app/coverage/lcov.info app
          fix panel/coverage/panel/lcov.info panel
      - name: Análisis de SonarQube Cloud
        if: steps.cfg.outputs.ready == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.scm.revision=${{ env.CI_SHA }}
